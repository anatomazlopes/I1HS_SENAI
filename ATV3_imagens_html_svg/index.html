<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de SVG com Object</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Logotipo do Senai SVG</h1>
        <!-- SVG Referenciado Externamente com a tag <object> -->
        <object data="images/senai-logo.svg" type="image/svg+xml" width="150" height="150">
            Seu navegador não suporta SVG.
        </object>
    </header>

</body>
</html>
